global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/reglas-o-alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Métricas internas de MongoDB (Hito 4) y Redis (Hito 7).
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          base: mongodb

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          base: redis

  # Cassandra (Hito 6): agente JMX dentro de la JVM. Solo existe si Cassandra
  # se levantó con fixture2030-cassandra/docker-compose.monitoreo.yml.
  - job_name: cassandra
    static_configs:
      - targets: ['host.docker.internal:7070']
        labels:
          base: cassandra

  # Neo4j (Hito 5): Community no trae endpoint de Prometheus. Exporter propio
  # (neo4j-exporter/) que consulta la base por la Query API en cada scrape.
  - job_name: neo4j
    static_configs:
      - targets: ['neo4j-exporter:9474']
        labels:
          base: neo4j

  # InfluxDB 3 Core (Hito 8): su propio /metrics, que exige el token de
  # administración. Prometheus lo lee de un archivo que NO está en el repo:
  # fixture2030-influxdb/secrets/prometheus-token (lo genera
  # scripts/preparar_token_influxdb.sh a partir de admin-token.json).
  # Sin ese archivo el target queda DOWN con el error del archivo faltante.
  - job_name: influxdb
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/influxdb-secrets/prometheus-token
    static_configs:
      - targets: ['host.docker.internal:8181']
        labels:
          base: influxdb

  # Disponibilidad de las cinco bases vía blackbox-exporter.
  # Cada target es "<módulo>|<dirección>"; el relabel lo separa en
  # el parámetro module, el parámetro target y la etiqueta "base".
  - job_name: salud-bases
    metrics_path: /probe
    static_configs:
      - targets: ['tcp_connect|host.docker.internal:27017']
        labels: {base: mongodb}
      - targets: ['tcp_connect|host.docker.internal:6379']
        labels: {base: redis}
      - targets: ['tcp_connect|host.docker.internal:9042']
        labels: {base: cassandra}
      - targets: ['http_2xx|http://host.docker.internal:7474']
        labels: {base: neo4j}
      - targets: ['http_2xx|http://host.docker.internal:8181/health']
        labels: {base: influxdb}
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^|]+)\|(.+)'
        target_label: __param_module
        replacement: '$1'
      - source_labels: [__address__]
        regex: '([^|]+)\|(.+)'
        target_label: __param_target
        replacement: '$2'
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # API integrada (Hito 10): uvicorn en la notebook, puerto 8000.
  # Métricas de APLICACIÓN (fixture2030_http_*) y de DEPENDENCIA
  # (fixture2030_dependencia_*), ver fixture2030-hito10-api/app/core/metricas.py.
  - job_name: fixture-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          capa: aplicacion

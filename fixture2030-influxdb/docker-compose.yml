# ============================================================
#  Fixture 2030 — Hito 8 · Series temporales de estadísticas en vivo
#  Ambiente local de InfluxDB 3 Core (Docker Compose)
#  Ingeniería de Datos II — Pazos / Núñez / Frisoli
# ------------------------------------------------------------
#  RNF1: imagen oficial `influxdb:3-core` con `pull_policy: always`, como
#        indica la Clase 9: el tag `influxdb:latest` apunta a InfluxDB 2.x
#        y no trae el binario `influxdb3` (ver README §0). La versión de
#        cada prueba se registra en docs/evidencia/01_inicializacion.txt.
#  RNF2: datos en ~/docker/data/influxdb mediante un VOLUMEN NOMBRADO
#        respaldado por esa carpeta (mismo patrón que Redis y Cassandra,
#        según la corrección del Hito 6):
#          ~/docker/data/influxdb -> /var/lib/influxdb3/data (catálogo, WAL y Parquet)
#  RNF7: sin credenciales en este archivo. El token de administración lo
#        crea scripts/autorizacion_local.sh (influxdb3 create token --admin)
#        y queda en ./secrets (ignorado por git).
#  §5.1: el servicio arranca con `docker compose up -d` sin pasos previos;
#        la autorización se crea después, con el servidor arriba.
#
#  NODO ÚNICO: laboratorio. InfluxDB 3 Core es un nodo único, sin
#  réplicas ni clúster (ver docs/cardinalidad_y_escalabilidad.md §6).
# ============================================================

services:
  influxdb:
    image: influxdb:3-core
    pull_policy: always
    container_name: fixture2030-influxdb
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=fixture2030-local
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
      # /health y /ping sin token: los usa el healthcheck de Docker. No exponen
      # datos (solo estado y versión); todo lo demás sigue exigiendo el token.
      - --disable-authz=health,ping
    ports:
      # API HTTP (escritura line protocol y consultas SQL). Solo en la notebook.
      - "127.0.0.1:${INFLUX_PORT:-8181}:8181"
    volumes:
      - influxdb_data:/var/lib/influxdb3/data
    healthcheck:
      # RF1: disponibilidad verificada con curl, incluido en la imagen
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8181/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - fixture2030-net

  # ----------------------------------------------------------
  #  Herramientas del módulo (generación, carga, consultas,
  #  agregaciones, validación). Python 3.12 SOLO con biblioteca
  #  estándar: nadie tiene que instalar nada en la notebook.
  #      docker compose run --rm herramientas scripts/<script>.py [args]
  # ----------------------------------------------------------
  herramientas:
    image: python:3.12-slim
    profiles: ["herramientas"]
    depends_on:
      influxdb:
        condition: service_healthy
    working_dir: /app
    environment:
      INFLUX_URL: http://influxdb:8181
      TOKEN_FILE: /app/secrets/admin-token.json
      EVIDENCIA_DIR: /app/docs/evidencia
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
      - ./docs/evidencia:/app/docs/evidencia
      - ./secrets:/app/secrets:ro
    entrypoint: ["python"]
    networks:
      - fixture2030-net

volumes:
  # RNF2 — volumen NOMBRADO respaldado por la carpeta de la convención de la
  # materia. La carpeta tiene que existir antes del primer `up` (la crea
  # inicializacion.sh, o: mkdir -p ~/docker/data/influxdb).
  # `docker compose down` conserva los datos; `down -v` borra el volumen de Docker
  # pero NO los archivos de la carpeta del host.
  influxdb_data:
    name: fixture2030_influxdb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INFLUX_DATA_DIR:-${HOME}/docker/data/influxdb}

networks:
  fixture2030-net:
    driver: bridge
    name: fixture2030-influxdb-net

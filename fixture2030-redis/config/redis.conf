# ============================================================
#  Fixture 2030 — Hito 7 · redis.conf (laboratorio, nodo único)
#  Cada directiva responde a una decisión documentada en
#  docs/memoria_y_escalabilidad.md (RF10).
# ============================================================

# Dentro del contenedor escucha en todas las interfaces; el compose
# sólo publica el puerto en 127.0.0.1 del host (RNF7).
bind 0.0.0.0
protected-mode no
port 6379

# ---- Memoria (RF10) ----------------------------------------
# Techo explícito: sin él Redis crece hasta agotar la RAM de Docker.
maxmemory 256mb
# volatile-lru: al llegar al techo sólo se desalojan claves CON TTL
# (sesiones inactivas y caché, ambas reconstruibles), las menos usadas
# recientemente. Las claves sin TTL (votación abierta) NO se desalojan;
# si la memoria se llena sólo con ellas, las escrituras fallan con OOM
# (comportamiento noeviction para ese subconjunto), que es preferible
# a perder votos en silencio.
maxmemory-policy volatile-lru
maxmemory-samples 10

# ---- Persistencia (RNF2) ------------------------------------
# AOF cada segundo: las Redis Functions y la votación sobreviven a un
# reinicio; se acepta perder hasta ~1 s de escrituras (dato transitorio).
appendonly yes
appendfsync everysec
save 900 1
save 300 100
dir /data

# ---- Observabilidad (RF13) ----------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 50

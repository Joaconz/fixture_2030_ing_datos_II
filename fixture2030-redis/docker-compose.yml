# ============================================================
#  Fixture 2030 — Hito 7 · Caché de Usuarios y Sesiones
#  Ambiente local de Redis (Docker Compose)
#  Ingeniería de Datos II — Pazos / Núñez / Frisoli
# ------------------------------------------------------------
#  RNF1: imagen oficial con etiqueta `latest` (la versión real se
#        registra con INFO server, ver README §6).
#  RNF2: persistencia con montaje local en ~/docker/data/redis.
#  RNF7: sin credenciales: nodo de laboratorio publicado sólo en
#        127.0.0.1 y sin contraseña. Es configuración de DESARROLLO.
#
#  NODO ÚNICO: laboratorio de aprendizaje. No es alta disponibilidad
#  (sin réplicas, sin Sentinel, sin Cluster). Ver
#  docs/memoria_y_escalabilidad.md §5.
# ============================================================

services:
  redis:
    image: redis:latest
    container_name: fixture2030-redis
    restart: unless-stopped

    # La configuración (memoria, política de evicción, AOF) vive en un
    # archivo versionado en el repo: así la decisión queda auditable.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

    ports:
      # Sólo loopback: el nodo no tiene contraseña, no debe exponerse a la red.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      # Persistencia exigida por RNF2: sobrevive a `docker compose down`.
      - ~/docker/data/redis:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # Los scripts del repo se ejecutan desde adentro del contenedor.
      - ./scripts:/scripts:ro
      - ./docs/evidencia:/evidencia

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

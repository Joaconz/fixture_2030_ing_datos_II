                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /partidos/{partido_id}/estado:
    patch:
      tags:
      - Partidos · Neo4j
      summary: Cierre validado del partido (PROGRAMADO → FINALIZADO) en una transacción de escritura
      operationId: cerrarPartido
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-[A-Z0-9]{1,8}(-[A-Z0-9]{1,8}){0,2}$
          description: Identificador del partido (clave natural del Hito 5).
          examples:
          - PAR-A-1
          title: Partido Id
        description: Identificador del partido (clave natural del Hito 5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstado'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartidoDetalle'
        '400':
          description: 'La request no cumple el contrato (parámetro, query o cuerpo inválido). Códigos: `VALIDATION_ERROR`.'
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: La request no cumple el contrato (parámetro, query o cuerpo inválido).
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'No existe el partido solicitado. Códigos: `MATCH_NOT_FOUND`.'
          content:
            application/json:
              examples:
                MATCH_NOT_FOUND:
                  summary: MATCH_NOT_FOUND

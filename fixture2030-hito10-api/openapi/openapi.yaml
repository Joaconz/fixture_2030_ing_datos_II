      summary: Publica un comentario (LOGGED BATCH en las dos tablas); idempotente por Idempotency-Key
      operationId: publicarComentario
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-[A-Z0-9]{1,8}(-[A-Z0-9]{1,8}){0,2}$

                    message: Parámetro inválido o cursor que no corresponde.
                    requestId: req-3f9c2a1b7d4e5f60
                INVALID_CURSOR:
                  summary: INVALID_CURSOR
                  value:
                    code: INVALID_CURSOR
                    message: Parámetro inválido o cursor que no corresponde.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'No existe el partido solicitado. Códigos: `MATCH_NOT_FOUND`.'
          content:
            application/json:
              examples:
                MATCH_NOT_FOUND:
                  summary: MATCH_NOT_FOUND
                  value:
                    code: MATCH_NOT_FOUND
                    message: No existe el partido solicitado.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'La fuente de datos no respondió (caída o timeout). Códigos: `DEPENDENCY_UNAVAILABLE`.'
          content:
            application/json:
              examples:
                DEPENDENCY_UNAVAILABLE:
                  summary: DEPENDENCY_UNAVAILABLE
                  value:
                    code: DEPENDENCY_UNAVAILABLE
                    message: La fuente de datos no respondió (caída o timeout).
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Error interno; el detalle técnico queda sólo en los logs. Códigos: `INTERNAL_ERROR`.'
          content:
            application/json:
              examples:
                INTERNAL_ERROR:
                  summary: INTERNAL_ERROR
                  value:
                    code: INTERNAL_ERROR
                    message: Error interno; el detalle técnico queda sólo en los logs.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Partidos · Neo4j
      summary: Registra un evento validado contra las reglas de su tipo (N8); idempotente por Idempotency-Key
      operationId: registrarEvento
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-[A-Z0-9]{1,8}(-[A-Z0-9]{1,8}){0,2}$
          description: Identificador del partido (clave natural del Hito 5).
          examples:
          - PAR-A-1
          title: Partido Id
        description: Identificador del partido (clave natural del Hito 5).
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
          description: Clave elegida por el cliente; repetir la request con la misma clave no duplica la escritura
            (RNF14).
          title: Idempotency-Key
        description: Clave elegida por el cliente; repetir la request con la misma clave no duplica la escritura
          (RNF14).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoNuevo'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '200':
          description: 'Reintento: el evento ya existía con esa clave'
          headers:
            Idempotent-Replayed:
              description: Presente con valor `true` cuando la respuesta corresponde a un reintento
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '400':
          description: 'Cuerpo inválido o regla del tipo de evento violada (N8). Códigos: `VALIDATION_ERROR`, `EVENT_RULE_VIOLATION`.'
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Cuerpo inválido o regla del tipo de evento violada (N8).
                    requestId: req-3f9c2a1b7d4e5f60
                EVENT_RULE_VIOLATION:
                  summary: EVENT_RULE_VIOLATION
                  value:
                    code: EVENT_RULE_VIOLATION
                    message: Cuerpo inválido o regla del tipo de evento violada (N8).
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'No existe el partido solicitado. Códigos: `MATCH_NOT_FOUND`.'
          content:
            application/json:
              examples:
                MATCH_NOT_FOUND:
                  summary: MATCH_NOT_FOUND
                  value:
                    code: MATCH_NOT_FOUND
                    message: No existe el partido solicitado.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'El estado del partido impide el evento, o la clave ya se usó con otro cuerpo. Códigos: `MATCH_FINALIZED`,
            `EVENT_AFTER_FIN`, `DUPLICATE_UNIQUE_EVENT`, `EVENT_TYPE_NOT_IN_CATALOG`, `IDEMPOTENCY_KEY_REUSED`.'
          content:
            application/json:
              examples:
                MATCH_FINALIZED:
                  summary: MATCH_FINALIZED
                  value:
                    code: MATCH_FINALIZED
                    message: El estado del partido impide el evento, o la clave ya se usó con otro cuerpo.
                    requestId: req-3f9c2a1b7d4e5f60
                EVENT_AFTER_FIN:
                  summary: EVENT_AFTER_FIN
                  value:
                    code: EVENT_AFTER_FIN
                    message: El estado del partido impide el evento, o la clave ya se usó con otro cuerpo.
                    requestId: req-3f9c2a1b7d4e5f60
                DUPLICATE_UNIQUE_EVENT:
                  summary: DUPLICATE_UNIQUE_EVENT
                  value:
                    code: DUPLICATE_UNIQUE_EVENT
                    message: El estado del partido impide el evento, o la clave ya se usó con otro cuerpo.
                    requestId: req-3f9c2a1b7d4e5f60
                EVENT_TYPE_NOT_IN_CATALOG:
                  summary: EVENT_TYPE_NOT_IN_CATALOG
                  value:
                    code: EVENT_TYPE_NOT_IN_CATALOG
                    message: El estado del partido impide el evento, o la clave ya se usó con otro cuerpo.
                    requestId: req-3f9c2a1b7d4e5f60
                IDEMPOTENCY_KEY_REUSED:
                  summary: IDEMPOTENCY_KEY_REUSED
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: El estado del partido impide el evento, o la clave ya se usó con otro cuerpo.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'La fuente de datos no respondió (caída o timeout). Códigos: `DEPENDENCY_UNAVAILABLE`.'
          content:
            application/json:
              examples:
                DEPENDENCY_UNAVAILABLE:
                  summary: DEPENDENCY_UNAVAILABLE
                  value:
                    code: DEPENDENCY_UNAVAILABLE
                    message: La fuente de datos no respondió (caída o timeout).
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Error interno; el detalle técnico queda sólo en los logs. Códigos: `INTERNAL_ERROR`.'
          content:
            application/json:
              examples:
                INTERNAL_ERROR:

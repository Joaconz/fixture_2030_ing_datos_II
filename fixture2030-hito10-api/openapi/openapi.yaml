openapi: 3.1.0
info:
  title: Fixture 2030 — API REST integrada
  description: 'API REST integrada del **Fixture Mundial 2030** (Ingeniería de Datos II, Hito 10).


    Cada ruta corresponde a un caso de uso (ver `docs/casos_de_uso.md`) y a una fuente concreta:

    MongoDB (equipos y jugadores), Neo4j (partidos, eventos y catálogo de tipos), Cassandra

    (comentarios), Redis (sesiones y caché del detalle de partido) e InfluxDB 3 (estadísticas en vivo).

    IRIS no forma parte de la arquitectura vigente desde la reentrega del Hito 3 (RF8 documentado como

    fuente no cubierta).


    Todos los errores usan el mismo formato `{code, message, requestId, details?}`. Toda respuesta

    lleva `X-Request-Id`, que también aparece en los logs de la API y de cada adaptador.

    '
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: API local (notebook)
paths:
  /equipos/{codigo}:
    get:
      tags:
      - Equipos · MongoDB
      summary: Ficha de un equipo (MongoDB, búsqueda por _id con proyección)
      operationId: getEquipo
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA de 3 letras.
          examples:
          - ARG
          title: Codigo
        description: Código FIFA de 3 letras.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'
        '400':
          description: 'La request no cumple el contrato (parámetro, query o cuerpo inválido). Códigos: `VALIDATION_ERROR`.'
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: La request no cumple el contrato (parámetro, query o cuerpo inválido).
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'No existe el equipo solicitado. Códigos: `TEAM_NOT_FOUND`.'
          content:
            application/json:
              examples:
                TEAM_NOT_FOUND:
                  summary: TEAM_NOT_FOUND
                  value:
                    code: TEAM_NOT_FOUND
                    message: No existe el equipo solicitado.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'La fuente de datos no respondió (caída o timeout). Códigos: `DEPENDENCY_UNAVAILABLE`.'
          content:
            application/json:
              examples:
                DEPENDENCY_UNAVAILABLE:
                  summary: DEPENDENCY_UNAVAILABLE
                  value:
                    code: DEPENDENCY_UNAVAILABLE
                    message: La fuente de datos no respondió (caída o timeout).
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Error interno; el detalle técnico queda sólo en los logs. Códigos: `INTERNAL_ERROR`.'
          content:
            application/json:
              examples:
                INTERNAL_ERROR:
                  summary: INTERNAL_ERROR
                  value:
                    code: INTERNAL_ERROR
                    message: Error interno; el detalle técnico queda sólo en los logs.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /equipos/{codigo}/jugadores:
    get:
      tags:
      - Equipos · MongoDB
      summary: Plantel paginado de un equipo (MongoDB, índice {equipoId, posicion})
      operationId: listJugadoresDeEquipo
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA de 3 letras.
          examples:
          - ARG
          title: Codigo
        description: Código FIFA de 3 letras.
      - name: posicion
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - Arquero
            - Defensor
            - Mediocampista
            - Delantero
            type: string
          - type: 'null'
          title: Posicion
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,200}={0,2}$
          - type: 'null'
          description: Cursor opaco devuelto como `nextCursor` por la página anterior.
          title: Cursor
        description: Cursor opaco devuelto como `nextCursor` por la página anterior.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaJugadores'
        '400':
          description: 'Parámetro inválido o cursor que no corresponde. Códigos: `VALIDATION_ERROR`, `INVALID_CURSOR`.'
          content:
            application/json:
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    code: VALIDATION_ERROR
                    message: Parámetro inválido o cursor que no corresponde.
                    requestId: req-3f9c2a1b7d4e5f60
                INVALID_CURSOR:
                  summary: INVALID_CURSOR
                  value:
                    code: INVALID_CURSOR
                    message: Parámetro inválido o cursor que no corresponde.
                    requestId: req-3f9c2a1b7d4e5f60
              schema:

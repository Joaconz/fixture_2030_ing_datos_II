  /partidos/{partido_id}:
    get:
      tags:
      - Partidos · Neo4j
      summary: 'Detalle de un partido: equipos, sede, estado y marcador (Neo4j + caché Redis)'
      operationId: getPartido
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-[A-Z0-9]{1,8}(-[A-Z0-9]{1,8}){0,2}$
          description: Identificador del partido (clave natural del Hito 5).
          examples:
          - PAR-A-1
          title: Partido Id
        description: Identificador del partido (clave natural del Hito 5).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartidoDetalle'
          headers:
            X-Cache:
              description: 'HIT (Redis), MISS (Neo4j y se guarda) o BYPASS (Redis no disponible: se sirvió desde
                Neo4j)'
              schema:
                type: string
                enum:
                - HIT
                - MISS
                - BYPASS
        '400':
          description: 'La request no cumple el contrato (parámetro, query o cuerpo inválido). Códigos: `VALIDATION_ERROR`.'
          content:
            application/json:
              examples:

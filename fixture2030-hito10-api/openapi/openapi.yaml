  /partidos/{partido_id}/eventos:
    get:
      tags:
      - Partidos · Neo4j
      summary: Timeline de eventos de un partido, en orden de secuencia (Cypher parametrizado)
      operationId: listEventosDePartido
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-[A-Z0-9]{1,8}(-[A-Z0-9]{1,8}){0,2}$
          description: Identificador del partido (clave natural del Hito 5).
          examples:
          - PAR-A-1
          title: Partido Id
        description: Identificador del partido (clave natural del Hito 5).
      - name: tipo
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - INICIO_PARTIDO
            - FIN_PARTIDO
            - PASE
            - CORNER
            - ATAJADA
            - ASISTENCIA
            - GOL
            - PENAL
            - FALTA
            - TARJETA_AMARILLA
            - TARJETA_ROJA
            - SUSTITUCION
            type: string
          - type: 'null'
          title: Tipo
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,200}={0,2}$
          - type: 'null'
          description: Cursor opaco devuelto como `nextCursor` por la página anterior.
          title: Cursor
        description: Cursor opaco devuelto como `nextCursor` por la página anterior.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEventos'
        '400':
          description: 'Parámetro inválido o cursor que no corresponde. Códigos: `VALIDATION_ERROR`, `INVALID_CURSOR`.'
          content:

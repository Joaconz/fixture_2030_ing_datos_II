components:
  schemas:
    CambioEstado:
      properties:
        estado:
          type: string
          const: FINALIZADO
          title: Estado
      additionalProperties: false
      type: object
      required:
      - estado
      title: CambioEstado
      description: 'Única transición expuesta: PROGRAMADO → FINALIZADO (cierre CP del Hito 3).'
    Colores:
      properties:
        principal:
          anyOf:
          - type: string
          - type: 'null'
          title: Principal
        alternativo:
          anyOf:
          - type: string
          - type: 'null'
          title: Alternativo
      additionalProperties: false
      type: object
      title: Colores
    Comentario:
      properties:
        comentarioId:
          type: string
          title: Comentarioid
          examples:
          - PAR-A-1-C000012
        partidoId:
          type: string
          title: Partidoid
        usuarioId:
          type: string
          title: Usuarioid
          examples:
          - USR-0000042
        alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Alias
        hinchada:
          anyOf:
          - type: string
            enum:
            - LOCAL
            - VISITANTE
            - NEUTRAL
          - type: 'null'
          title: Hinchada
        minutoPartido:
          anyOf:
          - type: integer
          - type: 'null'
          title: Minutopartido
        contenido:
          type: string
          title: Contenido
        idioma:
          anyOf:
          - type: string
            enum:
            - es
            - pt
            - en
            - fr
            - ar
          - type: 'null'
          title: Idioma
        creadoEn:
          type: string
          format: date-time
          title: Creadoen
        respondeA:
          anyOf:
          - type: string
          - type: 'null'
          title: Respondea
        estadoModeracion:
          type: string
          title: Estadomoderacion
          examples:
          - PUBLICADO
      additionalProperties: false
      type: object
      required:
      - comentarioId
      - partidoId
      - usuarioId
      - contenido
      - creadoEn
      - estadoModeracion
      title: Comentario
    ComentarioNuevo:
      properties:
        usuarioId:
          type: string
          pattern: ^USR-[A-Z0-9]{3,12}$
          title: Usuarioid
          examples:
          - USR-0000042
        alias:
          type: string
          maxLength: 40
          minLength: 1
          title: Alias
          examples:
          - hincha42
        contenido:
          type: string
          maxLength: 500
          minLength: 1
          title: Contenido
          examples:
          - ¡Qué golazo!
        creadoEn:
          type: string
          format: date-time
          title: Creadoen
          description: 'Instante del comentario en el reloj del torneo simulado (con zona horaria). Debe caer dentro
            del tramo de comentarios del partido (−15′ a +125′ del inicio). Es parte de la clave primaria: reenviar
            la misma request no duplica.'
          examples:
          - '2030-06-09T13:47:00Z'
        minutoPartido:
          anyOf:
          - type: integer
            maximum: 130.0
            minimum: 0.0
          - type: 'null'
          title: Minutopartido
        hinchada:
          anyOf:
          - type: string
            enum:
            - LOCAL
            - VISITANTE
            - NEUTRAL
          - type: 'null'
          title: Hinchada
        idioma:
          type: string
          enum:
          - es
          - pt
          - en
          - fr
          - ar
          title: Idioma
          default: es
        respondeA:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Respondea
      additionalProperties: false
      type: object
      required:

tags:
- name: Equipos · MongoDB
  description: 'Módulo documental (Hito 4): base `fixture2030`, colecciones `equipos` y `jugadores`.'
- name: Partidos · Neo4j
  description: Partidos (N2), eventos (N3) y catálogo de tipos (N8) en el grafo del Hito 5; el detalle usa caché
    Redis.
- name: Comentarios · Cassandra
  description: 'Keyspace `fixture2030_comentarios` (Hito 6): partición (partido, ventana de 10 min, bucket).'
- name: Sesiones · Redis
  description: Hash `f30:ses:{id}` con TTL (Hito 7).
- name: Estadísticas · InfluxDB
  description: Tabla `estadisticas_equipo` de la base `fixture2030_vivo` (Hito 8).
- name: Salud
  description: Vida de la API y conectividad de las fuentes.

version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: fixture2030-neo4j
    restart: always
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt port
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    environment:
      # Configuración de autenticación para el ambiente local de la materia
      NEO4J_AUTH: neo4j/fixture2030
      # Plugins para prácticas de procedimientos y algoritmos de grafos
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    networks:
      - neo4j-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  neo4j-network:
    driver: bridge
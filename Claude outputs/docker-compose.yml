# ============================================================
#  Fixture 2030 — Hito 5 · Módulo de Grafos
#  Ambiente local de Neo4j (Docker Compose)
#  Ingeniería de Datos II — Pazos / Núñez / Frisoli
# ------------------------------------------------------------
#  RNF1: se usa la etiqueta `latest` de la imagen oficial.
#  RNF2: persistencia de datos y logs con volúmenes NOMBRADOS.
#  RNF8: credenciales tomadas de variables de entorno (.env).
#  Nota: se omite la clave `version:` a propósito — está
#  obsoleta en Docker Compose V2 y genera un warning.
# ============================================================

services:
  neo4j:
    image: neo4j:latest
    container_name: fixture2030-neo4j
    restart: unless-stopped

    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser (http://localhost:7474)
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Protocolo Bolt (bolt://localhost:7687)

    environment:
      # --- Credenciales de desarrollo (RNF8) -----------------
      # NUNCA se versiona el .env real. Ver .env.example.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-fixture2030}"

      # --- Plugins del entorno de la materia -----------------
      # APOC: utilidades de procedimientos.
      # GDS : algoritmos de grafos (centralidad, caminos) para RF9.
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"

      # --- Memoria acotada para una notebook -----------------
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"

    volumes:
      # Volúmenes NOMBRADOS: la persistencia sobrevive a
      # `docker compose down` (RNF2).
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      # Bind mounts de trabajo: permiten ejecutar los .cypher
      # del repositorio desde adentro del contenedor sin copiarlos.
      - ./import:/var/lib/neo4j/import
      - ./queries:/queries:ro

    healthcheck:
      # El contenedor recién queda "healthy" cuando Bolt responde
      # una consulta real; evita ejecutar la carga demasiado pronto.
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-fixture2030} 'RETURN 1;' || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

    networks:
      - fixture2030-net

volumes:
  neo4j_data:
    name: fixture2030_neo4j_data
  neo4j_logs:
    name: fixture2030_neo4j_logs
  neo4j_plugins:
    name: fixture2030_neo4j_plugins

networks:
  fixture2030-net:
    driver: bridge
    name: fixture2030-net
